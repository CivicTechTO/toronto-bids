["solicitation.document_number"]
description = "10-digit normalized competitive identifier — the join key across award/bid/ariba_posting (the primary key)."

["solicitation.title"]
description = "The solicitation title. NULL means the City never published one (≈72% of rows); it does NOT mean 'unknown-and-recoverable'. See title_source for recovered titles."

["solicitation.title_source"]
description = "Where a recovered title came from when the City published none: 'bid_award_panel' | 'legacy_ariba_html' | 'council_pre_ariba'. NULL = the City's own feed."

["solicitation.source"]
description = "Which source last wrote the ROW (the OData spine owns this and re-upserts every sync). NOT title provenance — that is title_source."

["award.document_number"]
description = "The solicitation this award line belongs to (joins solicitation.document_number)."

["award.award_amount"]
description = "The City's published amount string, verbatim ('$1,317,169.92 CAD', 'kj'). Archive fidelity — NOT summable. Aggregate award_amount_numeric instead."

["award.award_amount_numeric"]
description = "Machine-parsed CAD amount (toronto_bids/amount.py). NULL beside a non-NULL award_amount means the raw string is not a single CAD amount. Aggregate on THIS column."

["award.award_amount_labelled"]
description = "Human-adjudicated amount for a string the parser refused (#74). Never merged into award_amount_numeric — keep that column machine-only."

["award.award_amount_verdict"]
description = "The human verdict behind award_amount_labelled: amount | not_an_amount | corrupt | unknown | not_an_award."

["award.source"]
description = "Award provenance ('odata' spine or 'ckan_awarded' cross-check). The same (document, supplier) can appear once per source — filter source='odata' or GROUP BY to de-duplicate."

["noncompetitive.workspace_number"]
description = "Identifier for a non-competitive contract — a separate keyspace with no join to document_number."

["noncompetitive.contract_amount"]
description = "The City's published contract-amount string, verbatim. NOT summable — aggregate contract_amount_numeric."

["noncompetitive.contract_amount_numeric"]
description = "Machine-parsed CAD contract amount. NULL when the raw string is not a single CAD amount."

["bid.reference"]
description = "The council item (e.g. '2016.BD106.3') this bid was tabulated under, for Bid Award Panel-era bids. NULL for Award Summary Form bids, which carry a document_number instead."

["bid.document_number"]
description = "The solicitation this bid belongs to (Award Summary Form era). NULL for panel-era bids, which carry a council reference instead."

["bid.bid_price"]
description = "The bidder's price, verbatim — including outcome strings the City writes in the price column ('Non-Compliant', 'No bid'). NOT the award value (a bid excludes contingency). Aggregate bid_price_numeric."

["bid.bid_price_numeric"]
description = "Machine-parsed bid price; NULL for the non-numeric outcome strings above."

["bid.hst_basis"]
description = "The tax basis a bid_price is stated on. Load-bearing: comparing prices across different bases without it is wrong."

["composite_award.call_number"]
description = "2009-2012 Call Number — a third keyspace predating Ariba, joining to neither document_number nor workspace_number (#96)."

["composite_award.award_value_numeric"]
description = "The FIRST net-of-taxes figure (initial term, excluding option years). Option-year/'total potential' figures beside it can be 2× larger and are deliberately not used."

["buyer.partnered"]
description = "Whether this agency buyer is only partly City-funded (e.g. TRCA). Set so a consumer can segment agency records rather than mix them into City-only headline counts (#135)."

["buyer.funding_share"]
description = "The City's funding share of a partnered buyer (TRCA: 0.626), for the segmentation above."

["agency_award.value_confidential"]
description = "1 when the award value was routed to a confidential attachment (MFIPPA) rather than published — a real distinction, not a missing NULL (#135)."

["solicitation_link.reference"]
description = "A pre-Ariba council item matched to a spine solicitation by (winner, value) — the #124/#165 equivalence, consumed by the export to nest pre-Ariba bids under their solicitation."

["solicitation_link.document_number"]
description = "The spine solicitation that solicitation_link.reference is the same procurement as."
["bid.status"]
description = "Extracted bid compliance/outcome when reported; independent of price and nullable for older sources."

["agency_bid.status"]
description = "Extracted bid compliance/outcome when reported; independent of the bid price."

["agency_bid.hst_basis"]
description = "Tax basis mapped from the extraction: including or excluding HST; unknown or net-of-taxes remains null."

["agency_bid.price_header"]
description = "Verbatim price column header when held in the extraction; never synthesized from the tax basis."


["procurement.id"]
description = "Archive-owned stable procurement identity. Publisher identifiers remain source keys or nonunique labels."
["procurement.merged_into"]
description = "Canonical procurement ID after a source-proven equivalence; NULL for current identities. Old IDs remain durable redirects."
["procurement.merge_evidence"]
description = "JSON evidence for joining this historical ID to another identity; no new fuzzy matching is performed."
["procurement_key.namespace"]
description = "Identity keyspace, including City document/workspace/call, Ariba event, legacy agency contract and buyer-scoped portal page."
["procurement_key.value"]
description = "Source identity within its namespace; a portal page URL, never an invented bid number."
["procurement_key.procurement_id"]
description = "Canonical archive procurement identity for this namespaced source key."
["portal_listing.portal_url"]
description = "Stable source page URL, unique per buyer; distinct pages remain separate even when printed references repeat."
["portal_listing.native_ref"]
description = "Published bid reference where recognized, nullable and nonunique; not sufficient evidence to join a board contract."
["portal_listing.procurement_id"]
description = "Archive procurement identity for this source page."
["procurement_document.procurement_id"]
description = "Procurement described by this document; a PDF may describe several procurements."
["procurement_document.url"]
description = "Source background_pdf URL. Association does not imply the bytes have been retrieved."
["procurement_council_item.procurement_id"]
description = "Procurement related to this council item; an item can concern several procurements."
["procurement_council_item.reference"]
description = "Source council_item reference, retained separately from procurement identity."

["solicitation.procurement_id"]
description = "Archive procurement identity, independent of the source ingest key. NULL when no single procurement association is established; consult the procurement document/item associations for multi-procurement context."

["award.procurement_id"]
description = "Archive procurement identity, independent of the source ingest key. NULL when no single procurement association is established; consult the procurement document/item associations for multi-procurement context."

["noncompetitive.procurement_id"]
description = "Archive procurement identity, independent of the source ingest key. NULL when no single procurement association is established; consult the procurement document/item associations for multi-procurement context."

["ariba_posting.procurement_id"]
description = "Archive procurement identity, independent of the source ingest key. NULL when no single procurement association is established; consult the procurement document/item associations for multi-procurement context."

["bid.procurement_id"]
description = "Archive procurement identity, independent of the source ingest key. NULL when no single procurement association is established; consult the procurement document/item associations for multi-procurement context."

["background_pdf.procurement_id"]
description = "Archive procurement identity, independent of the source ingest key. NULL when no single procurement association is established; consult the procurement document/item associations for multi-procurement context."

["composite_award.procurement_id"]
description = "Archive procurement identity, independent of the source ingest key. NULL when no single procurement association is established; consult the procurement document/item associations for multi-procurement context."

["ariba_attachment.procurement_id"]
description = "Archive procurement identity, independent of the source ingest key. NULL when no single procurement association is established; consult the procurement document/item associations for multi-procurement context."

["capital_project.procurement_id"]
description = "Archive procurement identity, independent of the source ingest key. NULL when no single procurement association is established; consult the procurement document/item associations for multi-procurement context."

["agency_solicitation.procurement_id"]
description = "Archive procurement identity, independent of the source ingest key. NULL when no single procurement association is established; consult the procurement document/item associations for multi-procurement context."

["agency_award.procurement_id"]
description = "Archive procurement identity, independent of the source ingest key. NULL when no single procurement association is established; consult the procurement document/item associations for multi-procurement context."

["agency_bid.procurement_id"]
description = "Archive procurement identity, independent of the source ingest key. NULL when no single procurement association is established; consult the procurement document/item associations for multi-procurement context."

["award_publication.source_key"]
description = "Archive observation key: published month, literal text block and duplicate occurrence; not a publisher contract number."
["award_publication.publication_month"]
description = "Publication month (YYYY-MM); the source does not publish an exact award day."
["award_publication.raw_text"]
description = "Complete visible source block with whitespace normalized; original HTML retained by snapshot SHA-256. A block may be context or contain several awards."
["award_publication.labels"]
description = "JSON array of verbatim published procurement-method and construction-manager attribution annotations; absence is not an inferred method."
["award_publication.snapshot_sha256"]
description = "SHA-256 of the latest complete original HTML snapshot in which this observation appeared."
["published_award.publication_key"]
description = "Foreign key to the source text block; source month, annotations, URL and snapshot provenance are on award_publication."
["published_award.supplier_name_raw"]
description = "Shared-model recipient, accepted only with an unambiguous literal name/value match outside construction-manager attribution annotations."
["published_award.award_amount"]
description = "Literal source value including rate or package qualifiers, where published. Never aggregate this text."
["published_award.award_amount_numeric"]
description = "Strictly parsed single amount; NULL for malformed grouping, rates, described package totals, or missing values."
["published_award.title_extracted"]
description = "Model-derived title; consult the source block for verbatim wording."
["published_award.extraction_sha256"]
description = "SHA-256 of the complete monthly extraction input; identifies the shared extraction cache result together with extractor_version."
["publication_extraction.status"]
description = "Latest monthly verification status: ok or incomplete. Supported claims may coexist with unresolved evidence; this is not a publisher-declared award count."
["publication_extraction.errors"]
description = "JSON list of pending extraction, unsupported model claims or unmatched monetary evidence. Raw source observations remain available."

["portal_listing.source"]
description = "Portal adapter that captured the public listing (bids_tenders or bonfire); distinct from board-report award evidence."
["portal_listing.status"]
description = "Named public listing status. Bonfire follows the anonymous UI's Open/Closed/Awarded/Cancelled rules; Awarded alone supplies no recipient/value fact."
["portal_listing.closing_date"]
description = "Published closing timestamp; Bonfire's UTC date strings are emitted with an explicit +00:00 offset. Cancelled Bonfire listings retain their published scheduled close."


["city_crosswalk_evidence.proof_sha256"]
description = "SHA-256 of the canonical immutable reviewed equivalence proof."

["city_crosswalk_evidence.reference"]
description = "Council item whose single native procurement is linked to the City document."

["city_crosswalk_evidence.document_number"]
description = "City publisher document identifier; never created by Call Number encoding."

["city_crosswalk_evidence.call_number"]
description = "Printed native Call Number in the original council agenda."

["city_crosswalk_evidence.proof_class"]
description = "publisher_native_call asserts an explicit publisher cross-reference; corroborated_compound records exact independent dates, supplier, scoped award value and solicitation type with global uniqueness."

["city_crosswalk_evidence.proof_json"]
description = "Original source witnesses, agenda and publisher hashes, source row ID and proof class; retained unchanged after acceptance."

["solicitation.publisher_identity_json"]
description = "Latest original OData identity-field snapshot: document/row IDs, issue/closing dates, type, publisher call details and current supplier/value pairs. Distinguishes source corrections/removals from retained historical award rows; reviewed crosswalks compare this snapshot before reusing proof."

["background_pdf.award_review_context_json"]
description = "Original publisher agenda/calendar context for a report captured before its meeting occurred. Requires independent decision review before deriving awards; supported bids remain eligible. Preserved across calendar passage and URL aliases of the same bytes."

["city_bid_evidence.proof_sha256"]
description = "Immutable digest of the committed source/cache/identity review for a City BA/BD bid projection."
["city_bid_evidence.proof_json"]
description = "Original report, whole extraction context, identity proof and bounded submission-table/row quotations; raw model cache is preserved separately."
["city_bid_evidence.source_role"]
description = "Reviewed receipt role, distinguishing submissions to this event from qualified/invited firms or an ancestor procurement."
["city_bid_evidence.bid_count"]
description = "Source-reviewed observations projected by this proof; not a claim of complete competition coverage beyond its report scope."

["bid_scope.scope_key"]
description = "Stable, reviewed source scope key within a report/source; names a part, lot, category or region rather than a new procurement."
["bid_scope.scope_status"]
description = "Literal source outcome for this scope, such as cancellation or non-award; does not erase submitted responses or imply bidder noncompliance."
["bid_scope.proof_sha256"]
description = "Source/cache/identity review binding original PDF rectangles, source names, scopes, alternatives and price cells."
["bid_response.response_kind"]
description = "A submitted response cell, explicit No Bid cell, unscoped outcome or unresolved source observation. Only submitted cells with a proven participation link count as resolved scoped submissions."
["bid_response.bid_id"]
description = "Participation summary for a proven firm that submitted at least one offer. NULL retains an unresolved party or an explicit nonparticipation observation without inventing a firm/bid."
["bid_response.identity_status"]
description = "Whether the literal source party is linked to proven participation, unresolved, or an unlinked explicit nonparticipant."
["bid_response.alternative_label"]
description = "Literal source-labelled alternative offer, separate from the supplier and bid scope. Several price variants of one offer do not create alternatives."
["bid_response.status"]
description = "Literal, source-supported outcome for this response only; an unstated outcome remains NULL and does not inherit another scope's status."
["bid_response_price.value_raw"]
description = "Complete original value cell, including correction markers and units. Source extremes and spelling are preserved."
["bid_response_price.value_kind"]
description = "Currency amount, percentage discount, or other source value. A percentage is not a currency bid total."
["bid_response_price.value_numeric"]
description = "Parsed currency total only; percentage discounts and unit rates remain NULL. Compare only values with compatible scope, unit, tax and price basis."
["bid_response_price.price_basis"]
description = "Literal qualifications, including option years, miscellaneous allowances or supplier-specific prompt-payment discounts; never silently removed from comparison."
["city_scoped_bid_evidence.proof_json"]
description = "Immutable reviewed source context, PDF rectangle quotations, source-cell relationships, raw cache accounting and explicit unresolved party/completeness findings."
